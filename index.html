<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0c1b59"
  >

  <meta
    name="description"
    content="SatuData SPPG - Pusat Informasi dan Data SPPG"
  >

  <title>SatuData SPPG</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #0c1b59;

      color:
        #ffffff;

      overflow:
        hidden;

    }


    /* =====================================================
       BACKGROUND
    ====================================================== */

    .background {

      position:
        fixed;

      inset:
        0;

      overflow:
        hidden;

      background:
        linear-gradient(
          135deg,
          #07133d 0%,
          #0c1b59 50%,
          #152b70 100%
        );

    }


    .circle {

      position:
        absolute;

      border-radius:
        50%;

      background:
        rgba(255,255,255,.035);

      animation:
        float 8s ease-in-out infinite;

    }


    .circle.one {

      width:
        420px;

      height:
        420px;

      top:
        -220px;

      right:
        -130px;

    }


    .circle.two {

      width:
        300px;

      height:
        300px;

      bottom:
        -180px;

      left:
        -120px;

      animation-delay:
        1.5s;

    }


    .circle.three {

      width:
        150px;

      height:
        150px;

      top:
        45%;

      right:
        18%;

      background:
        rgba(255,255,255,.025);

      animation-delay:
        3s;

    }


    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0)
          scale(1);

      }

      50% {

        transform:
          translateY(-20px)
          scale(1.04);

      }

    }


    /* =====================================================
       CONTAINER
    ====================================================== */

    .container {

      position:
        relative;

      z-index:
        10;

      width:
        100%;

      height:
        100vh;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        25px;

    }


    /* =====================================================
       CARD
    ====================================================== */

    .loading-card {

      width:
        min(420px, 100%);

      padding:
        42px 30px 30px;

      text-align:
        center;

      border-radius:
        24px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid
        rgba(255,255,255,.10);

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(18px);

      animation:
        cardIn .8s ease;

    }


    @keyframes cardIn {

      from {

        opacity:
          0;

        transform:
          translateY(20px)
          scale(.97);

      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =====================================================
       LOGO
    ====================================================== */

    .logo-wrapper {

      width:
        100px;

      height:
        100px;

      margin:
        0 auto 20px;

      border-radius:
        24px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #ffffff;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.20);

      animation:
        logoPulse 3s ease-in-out infinite;

    }


    @keyframes logoPulse {

      0%,
      100% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.035);

      }

    }


    .logo-wrapper svg {

      width:
        86px;

      height:
        86px;

    }


    /* =====================================================
       TEXT
    ====================================================== */

    .title {

      font-size:
        28px;

      font-weight:
        800;

      letter-spacing:
        -.5px;

    }


    .subtitle {

      margin-top:
        8px;

      color:
        rgba(255,255,255,.60);

      font-size:
        11px;

      line-height:
        1.6;

    }


    .divider {

      width:
        45px;

      height:
        3px;

      margin:
        20px auto;

      border-radius:
        5px;

      background:
        #ffffff;

      opacity:
        .75;

    }


    /* =====================================================
       LOADING
    ====================================================== */

    .loading-text {

      margin-bottom:
        12px;

      color:
        rgba(255,255,255,.70);

      font-size:
        9px;

      font-weight:
        600;

    }


    .loading-dots {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        7px;

      margin-bottom:
        18px;

    }


    .dot {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        #ffffff;

      opacity:
        .25;

      animation:
        dot 1.2s infinite ease-in-out;

    }


    .dot:nth-child(1) {

      animation-delay:
        0s;

    }


    .dot:nth-child(2) {

      animation-delay:
        .15s;

    }


    .dot:nth-child(3) {

      animation-delay:
        .30s;

    }


    @keyframes dot {

      0%,
      80%,
      100% {

        opacity:
          .25;

        transform:
          scale(.8);

      }

      40% {

        opacity:
          1;

        transform:
          scale(1.2);

      }

    }


    /* =====================================================
       PROGRESS
    ====================================================== */

    .progress {

      width:
        100%;

      height:
        4px;

      overflow:
        hidden;

      border-radius:
        20px;

      background:
        rgba(255,255,255,.10);

    }


    .progress-bar {

      width:
        0%;

      height:
        100%;

      border-radius:
        20px;

      background:
        #ffffff;

      animation:
        progress 2.2s
        ease-in-out
        forwards;

    }


    @keyframes progress {

      0% {

        width:
          0%;

      }

      60% {

        width:
          72%;

      }

      100% {

        width:
          100%;

      }

    }


    /* =====================================================
       FOOTER
    ====================================================== */

    .footer {

      margin-top:
        22px;

      color:
        rgba(255,255,255,.35);

      font-size:
        7px;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:500px) {

      .loading-card {

        padding:
          34px 22px 25px;

        border-radius:
          20px;

      }


      .logo-wrapper {

        width:
          85px;

        height:
          85px;

        border-radius:
          20px;

      }


      .logo-wrapper svg {

        width:
          73px;

        height:
          73px;

      }


      .title {

        font-size:
          24px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="background">

    <div class="circle one"></div>

    <div class="circle two"></div>

    <div class="circle three"></div>

  </div>



  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">


    <div class="loading-card">


      <!-- =================================================
           LOGO BGN
      ================================================== -->

      <div class="logo-wrapper">


        <svg
          viewBox="0 0 100 100"
          xmlns="http://www.w3.org/2000/svg"
        >


          <circle
            cx="50"
            cy="50"
            r="47"
            fill="#0c1b59"
          />


          <circle
            cx="50"
            cy="50"
            r="40"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
          />


          <path
            d="
              M50 17
              C43 27 31 31 25 42
              C19 53 25 67 38 74
              C45 78 48 80 50 84
              C52 80 55 78 62 74
              C75 67 81 53 75 42
              C69 31 57 27 50 17
              Z
            "
            fill="#ffffff"
          />


          <path
            d="
              M50 29
              C46 37 40 42 36 49
              C32 56 36 63 43 67
              C47 69 49 72 50 76
              C51 72 53 69 57 67
              C64 63 68 56 64 49
              C60 42 54 37 50 29
              Z
            "
            fill="#0c1b59"
          />


          <text
            x="50"
            y="92"
            text-anchor="middle"
            font-family="Arial"
            font-size="8"
            font-weight="700"
            fill="#ffffff"
          >
            BGN
          </text>


        </svg>


      </div>



      <!-- =================================================
           TITLE
      ================================================== -->

      <div class="title">

        SatuData SPPG

      </div>


      <div class="subtitle">

        Pusat Informasi, Data &
        Sistem Operasional SPPG

      </div>


      <div class="divider"></div>



      <!-- =================================================
           LOADING
      ================================================== -->

      <div
        class="loading-text"
        id="loadingText"
      >

        Menyiapkan sistem...

      </div>


      <div class="loading-dots">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

      </div>


      <div class="progress">

        <div class="progress-bar"></div>

      </div>



      <div class="footer">

        Satu pintu untuk berbagai
        sistem dan data SPPG

      </div>


    </div>


  </main>



  <script>

    /* =====================================================
       URL APPS SCRIPT
    ====================================================== */

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyemsYL7Zl81ZIP9SkktKN6bhoZq4GUpppuohQH923LNXzCvVIkNXmAJdiFyNQ_sFKb/exec";


    /* =====================================================
       LOADING TEXT
    ====================================================== */

    const messages = [

      "Menyiapkan sistem...",

      "Menghubungkan ke SatuData SPPG...",

      "Memuat layanan SPPG...",

      "Menyiapkan dashboard...",

      "Hampir selesai..."

    ];


    let messageIndex =
      0;


    const loadingText =
      document.getElementById(
        "loadingText"
      );


    const messageInterval =
      setInterval(
        function() {

          messageIndex++;

          if (
            messageIndex >=
            messages.length
          ) {

            messageIndex =
              messages.length - 1;

          }


          loadingText.textContent =
            messages[
              messageIndex
            ];

        },
        450
      );



    /* =====================================================
       REDIRECT
    ====================================================== */

    setTimeout(
      function() {

        clearInterval(
          messageInterval
        );


        loadingText.textContent =
          "Membuka SatuData SPPG...";


        window.location.replace(
          APP_URL
        );

      },
      2500
    );

  </script>


</body>

</html>
